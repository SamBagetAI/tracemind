<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* GitHub's repo card: 1280×640, with everything that matters inside an 80px border. */
  @font-face {
    font-family: "Schibsted Grotesk";
    src: url("../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2") format("woff2");
    font-weight: 400 900;
  }
  body { margin: 0; width: 1280px; height: 640px; background: #fff; font-family: "Schibsted Grotesk", system-ui, sans-serif; color: #1d1b18; }
  .safe { position: absolute; left: 80px; top: 80px; width: 1120px; height: 480px; display: flex; align-items: center; justify-content: center; gap: 48px; }
  .slug { width: 440px; display: block; }
  .name { font-size: 96px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .line { font-size: 34px; line-height: 1.3; color: #4a4a47; margin-top: 22px; max-width: 560px; }
  .mark { background: linear-gradient(transparent 55%, #ffe58a 55%); }
</style>
</head>
<body>
<div class="safe">
  <img class="slug" src="../web/public/slug.svg" alt="">
  <div>
    <div class="name">Tracemind</div>
    <div class="line">See what goes wrong in your Claude Code sessions, and <span class="mark">fix it</span>.</div>
  </div>
</div>
</body>
</html>
