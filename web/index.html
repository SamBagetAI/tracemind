<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Tracemind</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -4 22 22'%3E%3Crect x='0' y='0' width='2' height='14' rx='1' fill='%23999'/%3E%3Crect x='4' y='7' width='3' height='7' rx='1' fill='%23777'/%3E%3Crect x='9' y='5' width='4' height='9' rx='1' fill='%23ff6166'/%3E%3Crect x='15' y='8' width='5' height='6' rx='1' fill='%23777'/%3E%3C/svg%3E" />
    <script>
      // Dark unless the system asks for light; set before paint so there is no flash.
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.classList.remove("dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
